# api bridge + web host — the ONE dependency manifest the deployed host installs
# from (uv sync at bootstrap; EXACT pins on purpose — floor pins (>=) drift as
# upstreams release).
# Self-contained: includes the investigator package's deps because app.zip
# bundles api/app.py AND src/investigator together (api/README.md).
[project]
name = "payment-ws-api"
version = "0.1.0"
description = "Browser <-> AgentCore bridge + RLS-scoped reads (+ bundled investigator)"
license = "MIT-0"
requires-python = ">=3.14"
dependencies = [
    # api surface
    "fastapi==0.141.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    # RS256 JWT verification (replaced python-jose 2026-09)
    "PyJWT[crypto]==2.15.1",
    # bundled investigator package (src/pyproject.toml is the agent-bundle
    # manifest for AgentCore CodeZip; keep the shared pins IDENTICAL)
    "strands-agents==1.45.0",
    "bedrock-agentcore==1.22.0",
    "boto3==1.43.118",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    # transitive (mcp -> pyjwt[crypto]); pinned explicitly for PYSEC (>=50.0.0)
    "cryptography==50.0.2",
]

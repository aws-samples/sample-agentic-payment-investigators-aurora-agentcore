# investigator package — EXACT pins (prove-then-pin; no floor pins anywhere).
# The AgentCore CodeZip trap: deploy resolves this server-side — these pins ARE
# what ships.
[project]
name = "sample-agentic-payment-investigators-aurora-agentcore"
version = "0.1.0"
description = "Payment investigation agents — one pattern, three instantiations"
license = "MIT-0"
requires-python = ">=3.14"
dependencies = [
    "strands-agents==1.45.0",
    "bedrock-agentcore==1.22.0",
    "boto3==1.43.118",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    # transitive (mcp -> pyjwt[crypto]); pinned explicitly for PYSEC (>=50.0.0)
    "cryptography==50.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["investigator"]
